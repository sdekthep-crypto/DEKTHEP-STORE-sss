<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="x2RedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="x2Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded plate -->
  <rect x="4" y="4" width="112" height="112" rx="24" fill="#09090b" stroke="#1f242d" stroke-width="2"/>

  <!-- Left Upper White Wing of X -->
  <polygon points="22,18 42,18 64,52 46,55" fill="#f8fafc"/>
  
  <!-- Right Lower White Wing of X -->
  <polygon points="68,66 84,63 100,102 78,102" fill="#f8fafc"/>

  <!-- Right Upper White Wing of X -->
  <polygon points="76,18 98,18 72,56 58,48" fill="#f8fafc"/>

  <!-- Left Lower White Wing of X -->
  <polygon points="34,64 48,58 24,102 12,96" fill="#e2e8f0"/>

  <!-- Intense Red Slash / Blade Cut Across X -->
  <polygon points="14,78 96,28 106,34 26,86" fill="url(#x2RedGrad)" filter="url(#x2Glow)"/>
  <polygon points="20,82 102,32 104,38 24,88" fill="#ff4d4d"/>

  <!-- Crimson '2' Accent in the Upper Right Wing -->
  <path d="M78,28 C78,24 81,22 85,22 C89,22 92,24 92,27 C92,30 89,33 83,38 L83,41 L93,41 L93,39 L86,39 L90,35 C94,31 95,28 95,26 C95,21 90,19 85,19 C80,19 75,22 75,27 Z" fill="#ef4444" font-weight="900"/>
</svg>
